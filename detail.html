<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stello</title>
  <!-- The old full-page item view. Items now open in the side panel, the
       same panel as the Mac app (panel-layout.js), so old links land there. -->
  <script>
    (function () {
      var slug = new URLSearchParams(location.search).get('slug');
      location.replace(slug ? '/?panel=' + encodeURIComponent(slug) : '/');
    })();
  </script>
</head>
<body></body>
</html>
