<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="amber">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stello — Reset password</title>
  <script>
    // Match the random-accent treatment used on login.html so the
    // reset experience visually belongs to the same surface.
    (function(){
      var accents = ['lime', 'amber', 'iris'];
      var pick = accents[Math.floor(Math.random() * accents.length)];
      document.documentElement.setAttribute('data-accent', pick);
      document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Platypi:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css?v=2">
  <link rel="stylesheet" href="style.css?v=51">
</head>
<body>

  <div class="login-layout">
    <header class="header login-header" data-mode="email">
      <!-- Top-left "back to sign in" link, parallel treatment to the
           "Sign in options" link on login.html. -->
      <a class="login-back-link" href="/login.html">
        <svg width="14" height="14" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"/></svg>
        <span>Back to sign in</span>
      </a>

      <div class="header-row">
        <h1>Stello<sup class="header-count" id="reset-action">reset</sup></h1>

        <!-- Set or change the password of the signed-in account. Reached
             after Sign in with Apple or a one-time sign-in link (recovery),
             or from Settings. The error slot doubles as the status line. -->
        <form class="login-email-form" id="reset-form" novalidate>
          <p class="login-error" id="reset-error" aria-live="polite"></p>
          <input type="password" class="login-input" id="reset-current" placeholder="Current password" autocomplete="current-password" style="display:none">
          <input type="password" class="login-input" id="reset-password" placeholder="New password" required minlength="8" autocomplete="new-password">
          <button type="submit" class="login-submit" id="reset-submit" disabled>Set new password</button>
        </form>
      </div>
    </header>
  </div>

<script src="auth-client.js?v=1"></script>
<script>
(function () {
  'use strict';

  const $form = document.getElementById('reset-form');
  const $current = document.getElementById('reset-current');
  const $password = document.getElementById('reset-password');
  const $submit = document.getElementById('reset-submit');
  const $error = document.getElementById('reset-error');

  function showError(msg) {
    $error.style.color = '';
    $error.textContent = msg;
  }
  function showInfo(msg) {
    $error.style.color = 'var(--accent-contrast)';
    $error.textContent = msg;
  }

  (async function init() {
    const session = await Stello.getSession();
    if (!session) {
      showError('Sign in first (Sign in with Apple works if you forgot your password).');
      return;
    }
    // An existing password may need to be confirmed; the server skips that
    // right after a fresh sign-in, so the field is optional.
    if (session.has_password) {
      $current.style.display = '';
      $current.placeholder = 'Current password (skip if you just signed in)';
    }
    $submit.disabled = false;
    setTimeout(() => $password.focus(), 60);
  })();

  $form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const newPassword = $password.value;
    if (newPassword.length < 8) {
      showError('Password must be at least 8 characters.');
      return;
    }
    $submit.disabled = true;
    $error.textContent = '';
    const { error } = await Stello.updatePassword(newPassword, $current.value);
    if (error) {
      showError(error);
      $current.style.display = '';
      $submit.disabled = false;
      return;
    }
    showInfo('Password saved. Redirecting…');
    setTimeout(() => { window.location.href = '/?welcome=1'; }, 600);
  });
})();
</script>
</body>
</html>
