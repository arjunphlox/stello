<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="amber">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stello</title>
  <script>
    /* Paint the stored theme before first paint. Mirrors ThemeManager in app.js:
       "system" follows the OS; each mode has its own accent set. */
    (function(){try{var t=JSON.parse(localStorage.getItem('stello.theme'))||{};var m=t.mode==='light'||t.mode==='dark'?t.mode:(t.mode==='system'&&window.matchMedia&&!matchMedia('(prefers-color-scheme: dark)').matches?'light':'dark');var s={dark:['amber','lime','yellow','grass','cyan','orange'],light:['iris','violet','plum','indigo','teal','bronze']}[m];var a=s.indexOf(t.accent)>=0?t.accent:s[0];document.documentElement.setAttribute('data-theme',m);document.documentElement.setAttribute('data-accent',a);}catch(e){}})();
  </script>
  <script>
    /* GSAP-fallback gate: when arriving from login on a browser that doesn't
       support cross-document view transitions, paint the header in its hero
       footprint before first paint so runLoginArrivalFallback() in app.js
       can tween it back to compact. Runs synchronously in <head> to avoid
       a FOUC flash of the compact sticky state. */
    (function(){try{
      if (!new URLSearchParams(location.search).has('welcome')) return;
      var supportsCrossDocVT = window.CSS && CSS.supports && CSS.supports('(view-transition-name: none)') && ('onpagereveal' in window);
      if (!supportsCrossDocVT) document.documentElement.classList.add('arriving-from-login');
    }catch(e){}})();
  </script>
  <link rel="stylesheet" href="theme.css?v=2">
  <link rel="stylesheet" href="style.css?v=81">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/app/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/app/icon-192.png">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Stello">
</head>
<body>

  <!-- Tool-panel content templates (hidden; content moved into tool panel on open) -->
  <template id="tpl-filters">
    <button type="button" id="filter-needs-review" class="filter-review-toggle" aria-pressed="false">
      <span class="filter-review-check" aria-hidden="true"></span>Needs review
    </button>
    <button type="button" id="filter-offline" class="filter-review-toggle" aria-pressed="false">
      <span class="filter-review-check" aria-hidden="true"></span>Available offline
    </button>
    <div class="filter-search-wrap">
      <input type="text" id="filter-search" class="filter-search" placeholder="Search tags...">
    </div>
    <div id="filter-tag-drawer"></div>
  </template>

  <template id="tpl-settings">
    <!-- Profile header, as on the Mac (UserPreferencesContent ProfileHeaderRow). -->
    <div class="settings-profile-header">
      <label class="profile-avatar" title="Profile picture" aria-label="Profile picture">
        <input type="file" class="profile-avatar-input sr-only" accept="image/*">
        <span class="profile-avatar-img" aria-hidden="true"></span>
        <span class="profile-avatar-plus" aria-hidden="true">+</span>
      </label>
      <div class="profile-fields">
        <input type="text" class="profile-name" placeholder="Your name" maxlength="80" aria-label="Your name">
        <input type="text" class="profile-designation" placeholder="Designation" maxlength="80" aria-label="Designation">
      </div>
    </div>
    <fieldset class="settings-theme">
      <legend>Appearance</legend>
      <div class="settings-theme-row">
        <span class="settings-theme-label">Mode</span>
        <div class="theme-toggle" id="theme-mode-toggle">
          <span class="theme-toggle-option" data-mode="system">System</span>
          <span class="theme-toggle-option" data-mode="light">Light</span>
          <span class="theme-toggle-option" data-mode="dark">Dark</span>
        </div>
      </div>
      <div class="settings-theme-row">
        <span class="settings-theme-label">Accent</span>
        <!-- Filled by app.js: the current mode's six accents, as on the Mac. -->
        <div class="accent-swatches" id="accent-swatches"></div>
      </div>
    </fieldset>
    <fieldset class="settings-theme settings-grid">
      <legend>Grid</legend>
      <div class="settings-theme-row grid-columns" id="grid-columns">
        <span class="settings-theme-label grid-columns-label">Auto</span>
        <div class="grid-columns-stepper">
          <button type="button" data-step="-1" aria-label="Fewer columns">&minus;</button>
          <button type="button" data-step="1" aria-label="More columns">+</button>
        </div>
      </div>
      <p class="settings-hint">Pinch the grid to zoom, or set columns here.</p>
    </fieldset>
    <div class="settings-field">
      <label>API key profile</label>
      <input type="text" class="settings-profile" value="personal" placeholder="API key profile">
    </div>
    <div class="settings-field">
      <label>Anthropic API key</label>
      <input type="password" class="settings-key" placeholder="sk-ant-api03-...">
    </div>
    <div class="settings-actions">
      <button class="settings-save">Save</button>
      <span class="settings-status"></span>
    </div>
    <div class="settings-field settings-account">
      <label>Account</label>
      <span class="settings-account-email"></span>
      <div class="settings-actions">
        <a class="settings-save settings-password" href="/reset-password.html">Set password</a>
        <button class="settings-save settings-link-apple" type="button" hidden>Link Apple ID</button>
        <span class="settings-status settings-account-status"></span>
      </div>
    </div>
    <div class="settings-field settings-bookmarklet">
      <label>Save from any page</label>
      <div class="settings-actions">
        <a class="settings-save settings-bookmarklet-link" href="#" draggable="true">Save to Stello</a>
      </div>
      <p class="settings-hint">Drag this button to your bookmarks bar. Press it on any page to save that page to Stello.</p>
    </div>
    <div class="settings-footer">
      <button class="settings-logout" type="button">Log out</button>
    </div>
  </template>

  <template id="tpl-import">
    <textarea class="import-textarea" placeholder="Paste URLs here, one per line..."></textarea>
    <button class="import-submit">Import URLs</button>
    <label class="import-photo">
      <span>Choose Photo</span>
      <input type="file" class="import-photo-input sr-only" accept="image/*" multiple>
    </label>
    <div class="import-divider"><span>or</span></div>
    <div class="import-drop-zone">
      <p>Drop a CSV or Markdown list of links here</p>
      <input type="file" class="import-file" accept=".csv,.md,.txt,.markdown">
    </div>
  </template>

  <!-- Main Content + Panels -->
  <div class="main-layout">
    <div class="main-content">
      <div class="content-inner">
        <!-- Header (accent box, sticky, aligned to grid width). Actions live
             in the bottom floating bar, matching the Mac app. -->
        <header class="header">
          <div class="header-row">
            <h1>Stello<sup class="header-count" id="header-count"></sup></h1>
          </div>
        </header>
        <div class="active-filters" id="active-filters"></div>

        <main class="grid-container">
          <!-- Week timeline: one bar per week in the left gutter. Hover shows
               the week, click filters the grid to it (Mac app parity). -->
          <div class="timeline" id="timeline">
            <div class="timeline-bars" id="timeline-bars"></div>
            <div class="timeline-label" id="timeline-label" hidden></div>
          </div>
          <div id="masonry-grid"></div>
          <div class="grid-sentinel" id="grid-sentinel" aria-hidden="true"></div>
        </main>

        <!-- Bottom floating control bar: Add, Filters, Search, Profile -->
        <div class="bottom-bar" role="toolbar" aria-label="Library controls">
          <button class="bar-btn" id="import-btn" type="button" title="Add" data-icon="plus" aria-label="Add"></button>
          <button class="bar-btn" id="filter-panel-btn" type="button" title="Filters" data-icon="funnel" aria-label="Filters"></button>
          <label class="bar-search">
            <span class="bar-search-icon" data-icon="magnifying-glass" aria-hidden="true"></span>
            <input type="search" class="search-input" id="search-input" placeholder="Search items…" aria-label="Search items" autocomplete="off">
          </label>
          <button class="bar-btn bar-btn-avatar" id="settings-btn" type="button" title="Settings" data-icon="user-circle" aria-label="Settings"></button>
        </div>
      </div>
    </div>
    <aside class="panels-container" id="panels-container" aria-label="Comparison and tool panels"></aside>
  </div>

  <div id="panel-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

<script src="auth-client.js?v=1"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="desktop-context.js?v=1"></script>
<script src="panel-layout.js?v=2"></script>
<script src="offline.js?v=1"></script>
<script src="app.js?v=60"></script>
</body>
</html>
