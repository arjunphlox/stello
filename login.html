<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="amber">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stello — Sign in</title>
  <script>
    // Apply random accent on each visit
    (function(){
      var accents = ['lime', 'amber', 'iris'];
      var pick = accents[Math.floor(Math.random() * accents.length)];
      document.documentElement.setAttribute('data-accent', pick);
      document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Platypi:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css?v=1">
  <link rel="stylesheet" href="style.css?v=75">
</head>
<body>

  <div class="login-layout">
    <header class="header login-header" data-mode="choose">
      <div class="header-row">
        <h1>Stello<sup class="header-count" id="login-action">scout</sup></h1>

        <div class="header-actions login-actions" id="login-choose">
          <p class="login-error" id="login-error" aria-live="polite"></p>
          <button class="login-btn" id="apple-login" type="button" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09M12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
            Sign in with Apple ID
          </button>
          <!-- CloudKit JS renders its Apple ID button here; our styled button
               forwards the click so the sign-in popup opens from a user gesture. -->
          <div id="ck-sign-in" class="login-ck-button" aria-hidden="true"></div>
        </div>
      </div>
    </header>
  </div>

<script src="icloud-client.js?v=1"></script>
<script>
(function () {
  'use strict';

  const $action = document.getElementById('login-action');
  const $apple = document.getElementById('apple-login');
  const $ck = document.getElementById('ck-sign-in');
  const $error = document.getElementById('login-error');

  // --- Action-word shuffle in superscript ---
  const actions = [
    'wander', 'linger', 'gather', 'savor',
    'muse', 'ponder', 'dream', 'marvel',
    'reminisce', 'rediscover', 'uncover',
    'treasure', 'curate', 'discover'
  ];
  let actionIdx = Math.floor(Math.random() * actions.length);
  $action.textContent = actions[actionIdx];
  setInterval(() => {
    actionIdx = (actionIdx + 1) % actions.length;
    $action.style.opacity = '0';
    setTimeout(() => {
      $action.textContent = actions[actionIdx];
      $action.style.opacity = '';
    }, 220);
  }, 2400);

  function showError(text) {
    $error.textContent = text;
    $error.classList.remove('shake');
    void $error.offsetWidth;
    $error.classList.add('shake');
  }

  // Signed in already → straight to the grid. Otherwise CloudKit renders its
  // Apple ID button into #ck-sign-in and resolves once the user signs in.
  Stello.waitForSignIn({ signIn: 'ck-sign-in' })
    .then(() => { window.location.href = '/?welcome=1'; })
    .catch((e) => {
      console.error(e);
      showError('iCloud sign-in is unavailable right now.');
    });

  // Enable our button once CloudKit's button exists.
  new MutationObserver(() => {
    if ($ck.firstElementChild) $apple.disabled = false;
  }).observe($ck, { childList: true, subtree: true });

  $apple.addEventListener('click', () => {
    const target = $ck.querySelector('a, button, [role="button"], div[id]') || $ck.firstElementChild;
    if (target) target.click();
    else showError('Sign-in is still loading, try again in a moment.');
  });
})();
</script>
</body>
</html>
