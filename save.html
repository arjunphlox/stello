<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="amber">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save to Stello</title>
  <script>
    // Same theme as the app (index.html's head script, kept short).
    (function () {
      var t = {}; try { t = JSON.parse(localStorage.getItem('stello.theme') || '{}') || {}; } catch (e) {}
      var mode = t.mode === 'light' || t.mode === 'dark' ? t.mode
        : (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', mode);
      document.documentElement.setAttribute('data-accent', t.accent || (mode === 'light' ? 'iris' : 'amber'));
    })();
  </script>
  <link rel="stylesheet" href="theme.css?v=2">
  <link rel="stylesheet" href="style.css?v=80">
  <style>
    /* The bookmarklet's small save window (the web's Share Extension). */
    body.save-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .save-card { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 10px; }
    .save-brand { font-size: 13px; color: var(--text-dim); }
    .save-title { font-size: 18px; font-weight: 600; color: var(--text); overflow-wrap: anywhere; }
    .save-url { font-size: 12px; color: var(--text-secondary); overflow-wrap: anywhere; }
    .save-status { font-size: 14px; color: var(--text); }
    .save-status.is-ok { color: var(--accent); }
    .save-actions { display: flex; gap: 8px; margin-top: 4px; }
    .save-actions a, .save-actions button {
      font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 6px; cursor: pointer;
      border: 1px solid var(--border); background: transparent; color: var(--text); text-decoration: none;
    }
    .save-actions .is-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
  </style>
</head>
<body class="save-page">
  <main class="save-card" aria-live="polite">
    <div class="save-brand">Stello</div>
    <div class="save-title" id="save-title"></div>
    <div class="save-url" id="save-url"></div>
    <div class="save-status" id="save-status">Saving…</div>
    <div class="save-actions" id="save-actions" hidden></div>
  </main>
  <script src="auth-client.js?v=1"></script>
  <script>
  (async function () {
    const params = new URLSearchParams(location.search);
    const url = params.get('url') || '';
    const title = params.get('title') || '';
    const $title = document.getElementById('save-title');
    const $url = document.getElementById('save-url');
    const $status = document.getElementById('save-status');
    const $actions = document.getElementById('save-actions');
    $title.textContent = title || url;
    $url.textContent = title ? url : '';

    function done(text, ok, actions) {
      $status.textContent = text;
      $status.classList.toggle('is-ok', !!ok);
      $actions.innerHTML = '';
      (actions || []).forEach(a => $actions.appendChild(a));
      $actions.hidden = !(actions && actions.length);
    }
    function link(label, href, primary) {
      const a = document.createElement('a');
      a.textContent = label; a.href = href; a.target = '_blank'; a.rel = 'noopener';
      if (primary) a.className = 'is-primary';
      return a;
    }
    function closeBtn() {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = 'Close';
      b.addEventListener('click', () => window.close());
      return b;
    }

    if (!/^https?:\/\//i.test(url)) {
      done('This page can’t be saved: only web links can.', false, [closeBtn()]);
      return;
    }
    const session = await Stello.getSession();
    if (!session) {
      done('Sign in to Stello, then press the button again.', false, [link('Sign in', '/login.html', true), closeBtn()]);
      return;
    }
    try {
      const res = await Stello.apiFetch('/api/capture', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type: 'url', content: url }),
      });
      const item = await res.json().catch(() => ({}));
      if (res.status === 409) {
        done('Already in Stello.', true, [link('Open Stello', '/', true), closeBtn()]);
        return;
      }
      if (!res.ok) throw new Error(item.error || 'Save failed');
      if (item.title) $title.textContent = item.title;
      done('Saved to Stello.', true, [link('Open Stello', '/', false), closeBtn()]);
      setTimeout(() => window.close(), 1600);
    } catch (err) {
      done('Couldn’t save: ' + err.message, false, [closeBtn()]);
    }
  })();
  </script>
</body>
</html>
